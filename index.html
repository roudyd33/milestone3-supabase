<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button Demo</title>
    <style>
      :root {
        --bg: #f3f4f6;
        --card: #ffffff;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --text: #111827;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #e0f2fe, #f8fafc);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .card {
        background: var(--card);
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(37, 99, 235, 0.12);
        padding: 2rem 2.5rem;
        text-align: center;
      }

      h1 {
        margin-top: 0;
        margin-bottom: 1rem;
        font-size: 1.8rem;
      }

      button {
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 999px;
        padding: 0.9rem 1.8rem;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, background 0.15s ease;
      }

      button:hover {
        background: var(--primary-dark);
      }

      button:active {
        transform: scale(0.98);
      }

      .status {
        margin-top: 1rem;
        min-height: 1.5rem;
        font-size: 0.95rem;
        color: #374151;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Example Button</h1>
      <button id="demoButton" type="button">Click Me</button>
      <div id="status" class="status" aria-live="polite"></div>
    </div>

    <script>
      const button = document.getElementById('demoButton');
      const status = document.getElementById('status');

      button.addEventListener('click', () => {
        const now = new Date();
        status.textContent = `Button clicked at ${now.toLocaleTimeString()}.`;
        button.textContent = 'Clicked!';
      });
    </script>
  </body>
</html>
